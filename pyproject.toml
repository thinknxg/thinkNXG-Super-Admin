[project]
name = "thinknxg_super_admin"
authors = [
    { name = "Kreatao", email = "sales@kreatao.com" }
]
description = "Centralized SSO and multi-site management for thinkNXG / Frappe v16"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
    # cryptography and PyJWT are already hard dependencies of frappe v16.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017", "B018", "B023", "B904", "E101", "E402", "E501", "E741", "F401", "F403", "F405",
    "F722", "W191", "UP030", "UP031", "UP032", "UP037", "RUF001", "RUF002", "RUF003", "RUF012", "RUF015",
]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
