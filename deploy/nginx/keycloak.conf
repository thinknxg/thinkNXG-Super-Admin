# Keycloak behind nginx. Replace sso.example.com, the certificate paths and the allow-list file.
# Exposed: /realms/, /resources/. Not exposed: /, /metrics, /health, port 9000 (never proxied).
# /admin/ and the master realm are reachable only from the networks in tnxg-sso-admin-ips.conf,
# which MUST include the Super Admin host (it calls /admin/realms/... with its service account).

server {
	listen 80;
	server_name sso.example.com;
	location /.well-known/acme-challenge/ { root /var/www/certbot; }
	location / { return 301 https://$host$request_uri; }
}

server {
	listen 443 ssl;
	# nginx >= 1.25.1: add "http2 on;" here (older versions: "listen 443 ssl http2;").
	server_name sso.example.com;

	ssl_certificate     /etc/letsencrypt/live/sso.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/sso.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_timeout 1d;
	ssl_session_cache shared:SSL_KC:10m;
	ssl_session_tickets off;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options "nosniff" always;

	client_max_body_size 1m;

	# Proxy header hygiene: overwrite what clients send, drop headers that can be spoofed.
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto https;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Port 443;
	proxy_set_header Forwarded "";
	proxy_set_header X-Real-IP "";
	proxy_set_header traceparent "";
	proxy_buffer_size 128k;
	proxy_buffers 4 256k;
	proxy_busy_buffers_size 256k;

	location ^~ /realms/master/ {
		include /etc/nginx/tnxg-sso-admin-ips.conf;
		deny all;
		proxy_pass http://127.0.0.1:8080;
	}
	location /realms/   { proxy_pass http://127.0.0.1:8080; }
	location /resources/ { proxy_pass http://127.0.0.1:8080; }
	location /admin/ {
		include /etc/nginx/tnxg-sso-admin-ips.conf;
		deny all;
		proxy_pass http://127.0.0.1:8080;
	}
	location / { return 404; }
}
