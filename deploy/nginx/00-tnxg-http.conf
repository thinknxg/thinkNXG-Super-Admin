# thinkNXG Super Admin: http-level settings. Install as /etc/nginx/conf.d/00-tnxg-http.conf
# Defines rate-limit keys and the Desk allow-list; nothing here changes a server until
# tnxg-site.conf is included in that server block.

server_tokens off;
limit_req_status 429;

# Key is empty (= not limited) unless the request is to a sensitive path.
map $request_uri $tnxg_key_sensitive {
	default "";
	~^/api/method/login            $binary_remote_addr;
	~^/api/method/frappe\.core\.doctype\.user\.user\.(reset_password|sign_up|send_login_mail) $binary_remote_addr;
}
map $request_uri $tnxg_key_pair {
	default "";
	~^/api/method/thinknxg_super_admin\.api\.agent_in\.pair $binary_remote_addr;
}
limit_req_zone $tnxg_key_sensitive zone=tnxg_sensitive:10m rate=30r/m;
limit_req_zone $tnxg_key_pair      zone=tnxg_pair:10m      rate=6r/m;

# Desk, login and resource API only from these networks (1 = allowed). Edit tnxg-admin-ips.conf.
geo $tnxg_admin_ip {
	include /etc/nginx/tnxg-admin-ips.conf;
}
map $request_uri $tnxg_desk_path {
	default 0;
	~^/(app|desk|login)(/|\?|$)    1;
	~^/api/method/login            1;
	~^/api/resource/               1;
}
map "$tnxg_admin_ip:$tnxg_desk_path" $tnxg_desk_denied {
	default 0;
	"0:1" 1;
}
