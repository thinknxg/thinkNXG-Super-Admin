# Include inside the HTTPS server block of the Super Admin site, e.g. directly after server_name.
# deploy/nginx/apply_nginx.sh does this for the nginx.conf that "bench setup nginx" generates.

if ($tnxg_desk_denied) { return 403; }

limit_req zone=tnxg_sensitive burst=10 nodelay;
limit_req zone=tnxg_pair      burst=3  nodelay;

# Replace, never duplicate, headers that the application may also send.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
# Add includeSubDomains only once every subdomain is HTTPS-only.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Never serve dotfiles (.git, .env), except ACME challenges.
location ~ /\.(?!well-known) { deny all; }
